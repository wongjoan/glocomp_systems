<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Performance — Glocomp Systems</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/gc.css">
<link rel="stylesheet" href="assets/dashstack.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
</head>
<body>
<div class="viz-root app-shell" id="root">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sb-brand"><span class="sb-logo">G</span><span class="sb-name">Glo<b>comp</b> <small>Systems</small></span></div>
    <nav class="sb-nav" aria-label="Pages">
      <span class="sb-indicator" aria-hidden="true"></span>
      <div class="sb-group">Me</div>
      <a class="sb-item active" href="/employee" aria-current="page"><i class="sb-ico" data-icon="me"></i><span class="sb-label">My Performance</span></a>
      <a class="sb-item" id="toDashboard" href="/dashboard" hidden><i class="sb-ico" data-icon="dashboard"></i><span class="sb-label">Management dashboard</span></a>
    </nav>
    <div class="sb-footer">
      <button class="sb-link" id="logoutBtn" type="button"><i class="sb-ico" data-icon="logout"></i><span class="sb-label">Sign out</span></button>
      <button class="sb-link sb-collapse" id="sbCollapse" type="button"><i class="sb-ico" data-icon="collapse"></i><span class="sb-label">Collapse</span></button>
    </div>
  </aside>
  <div class="sb-backdrop"></div>
  <div class="app-main">
    <header class="topbar">
      <button class="icon-btn" id="sbToggle" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true"><i data-icon="menu"></i></button>
      <div class="tb-title"><h1 id="pageTitle">My Performance</h1><p id="who">Loading…</p></div>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark mode"><i data-icon="moon"></i></button>
      <div class="tb-profile" id="userChip"><span class="tb-avatar">…</span><span class="tb-who"><b>Signing in…</b><span></span></span></div>
    </header>
    <main id="meContent"><p class="loading">Loading your scorecard…</p></main>
  </div>
</div>
<script src="assets/gc.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  "use strict";
  GC.theme(document.getElementById("root"), document.getElementById("themeToggle"));
  document.getElementById("logoutBtn").addEventListener("click", GC.logout);
  var host = document.getElementById("meContent");

  GC.api("/api/session").then(function (s) {
    document.getElementById("userChip").innerHTML = GC.profileHtml(s.user);
    if (s.user.level !== "employee") document.getElementById("toDashboard").hidden = false;
    if (s.user.level === "director") {
      host.innerHTML = '<div class="notice">The Director is not scored in this prototype. <a href="/dashboard">Open the management dashboard →</a></div>';
      return null;
    }
    return GC.api("/api/me").then(function (card) { render(card, s); });
  }).catch(function (e) { host.innerHTML = '<p class="err">' + GC.esc(e.message) + "</p>"; });

  function render(card, s) {
    document.getElementById("who").textContent = card.employee.name + " · " + card.employee.title + " · " + card.employee.dept + " · " + card.period + " · anonymised demo data, no pay information";
    var focus = card.improvement_focus;
    host.innerHTML =
      GC.scoreTiles(card) +
      '<div class="grid cols-2" style="margin-bottom:20px;">' +
        GC.weightCard(card, { readOnlyNote: "<b>View only</b> — agreed with " + GC.esc(card.agreed_with || "your manager") + "." }) +
        '<div class="card"><h3>Progress over the last 4 quarters</h3><p class="card-sub">Your overall score each quarter, calculated with your current weightage</p>' +
          GC.spark(card.trend, 360, 90) +
          '<table class="data-table" style="margin-top:8px;"><tbody>' + card.trend.map(function (t) {
            return "<tr><td>" + t.period + "</td><td>" + GC.meter(t.overall) + "</td></tr>";
          }).join("") + "</tbody></table></div>" +
      "</div>" +
      '<div class="card" style="margin-bottom:20px;"><div class="card-head"><div><h3>KPI breakdown</h3>' +
        '<p class="card-sub">Targets agreed with ' + GC.esc(card.agreed_with || "your manager") + " · highlighted row = biggest gap</p></div>" +
        '<button class="table-toggle" type="button" data-explain="overall">Explain my score</button></div>' + GC.kpiTable(card) + "</div>" +
      (focus && focus.length
        ? '<div class="card"><h3>Your improvement focus</h3><p class="card-sub">Where the most points can be recovered, with a suggested next step to discuss with your manager</p>' +
          '<table class="data-table"><thead><tr><th>KPI</th><th class="num">Achieved</th><th class="num">Points to recover</th><th>Suggested action</th></tr></thead><tbody>' +
          focus.map(function (f) {
            return "<tr><td><b>" + GC.esc(f.name) + '</b></td><td class="num">' + f.attainment_pct.toFixed(0) + '%</td><td class="num">' + f.points_lost.toFixed(1) + "</td><td>" + GC.esc(f.suggested_action) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : '<div class="card"><h3>Your improvement focus</h3><p class="card-sub" style="margin:0;">No material gaps this quarter — keep going.</p></div>');
    GC.wireExplain(host, card);
  }
})();
</script>
</body>
</html>
