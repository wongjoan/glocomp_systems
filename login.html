<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Glocomp Systems</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/gc.css">
<link rel="stylesheet" href="assets/dashstack.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
</head>
<body>
<div class="viz-root auth-page" id="root">
  <div class="auth-card">
    <div class="row" style="justify-content:center;margin-bottom:18px;"><span class="sb-logo">G</span><span class="sb-name">Glo<b>comp</b> <small>Systems</small></span></div>
    <h1>Login to Account</h1>
    <p class="auth-sub">Commercial performance &amp; ROI · choose a role, then enter that role's demo code</p>
    <form id="loginForm">
      <div class="field"><span style="font-weight:700;color:var(--text-primary);">Demo persona</span></div>
      <div class="persona" id="featured" role="radiogroup" aria-label="Demo persona"></div>
      <label class="field" style="margin-bottom:14px;">
        <span style="font-weight:700;color:var(--text-primary);">…or any employee</span>
        <input id="employeeSearch" type="search" autocomplete="off" aria-label="Search employees by name, role or department" placeholder="Search name, role or department…" style="height:40px;margin-bottom:6px;">
        <select id="employeePick"><option value="">Choose an employee</option></select>
        <small class="muted" id="employeeCount"></small>
      </label>
      <label class="field" style="margin-bottom:6px;">
        <span style="font-weight:700;color:var(--text-primary);" id="codeLabel">Demo code</span>
        <input id="code" type="password" autocomplete="off" required style="height:46px;">
      </label>
      <p class="code-for" id="codeFor"></p>
      <p class="code-for" id="codeHint"></p>
      <button class="btn primary" type="submit">Sign In</button>
      <p class="err" id="loginErr" role="alert" style="text-align:center;min-height:18px;margin:10px 0 0;"></p>
    </form>
  </div>
</div>
<script src="assets/gc.js"></script>
<script>
(function () {
  "use strict";
  GC.theme(document.getElementById("root"));
  var featured = document.getElementById("featured"), pick = document.getElementById("employeePick");
  var levels = {};   // persona id -> level, so the code prompt can name the right role

  function selectedId() {
    var sel = featured.querySelector("input:checked");
    return pick.value || (sel && sel.value);
  }
  function updateCodePrompt() {
    var lvl = levels[selectedId()];
    var label = lvl ? GC.levelLabel[lvl] : "";
    document.getElementById("codeLabel").textContent = label ? label + " demo code" : "Demo code";
    document.getElementById("codeFor").innerHTML = label ? "Signing in as a <b>" + GC.esc(label) + "</b> — use the " + GC.esc(label.toLowerCase()) + " code." : "";
  }

  GC.api("/api/personas", { noRedirect: true }).then(function (d) {
    featured.innerHTML = d.featured.map(function (p, i) {
      levels[p.id] = p.level;
      return '<label><input type="radio" name="persona" value="' + GC.esc(p.id) + '"' + (i === 0 ? " checked" : "") + '><span><span class="level-pill">' +
        GC.levelLabel[p.level] + '</span><div class="n">' + GC.esc(p.name) + '</div><div class="t">' + GC.esc(p.title) + "</div></span></label>";
    }).join("");
    pick.innerHTML += d.employees.map(function (p) {
      levels[p.id] = p.level;
      return '<option data-q="' + GC.esc([p.name, p.title, p.dept].join(" ").toLowerCase()) + '" value="' + GC.esc(p.id) + '">' + GC.esc(p.name) + " — " + GC.esc(p.title) + " (" + GC.esc(p.dept) + ")</option>";
    }).join("");
    document.getElementById("codeHint").textContent = d.access_code_hint || "";
    updateCodePrompt();
  }).catch(function (e) { document.getElementById("loginErr").textContent = e.message; });

  pick.addEventListener("change", function () {
    if (pick.value) featured.querySelectorAll("input").forEach(function (i) { i.checked = false; });
    updateCodePrompt();
  });
  // Filter the employee list; if the chosen employee is filtered out, pick the first match instead.
  var search = document.getElementById("employeeSearch");
  search.addEventListener("input", function () {
    var q = search.value.trim().toLowerCase(), opts = pick.querySelectorAll("option[data-q]"), first = null, shown = 0;
    opts.forEach(function (o) {
      o.hidden = q !== "" && o.dataset.q.indexOf(q) === -1;
      if (!o.hidden) { shown++; if (!first) first = o; }
    });
    document.getElementById("employeeCount").textContent = !q ? "" : shown ? shown + " of " + opts.length + " employees" : "No employee matches “" + search.value.trim() + "”";
    var cur = pick.options[pick.selectedIndex];
    if (q && first && (!cur || cur.hidden || !cur.value)) { pick.value = first.value; pick.dispatchEvent(new Event("change")); }
    else if (q && !first && pick.value) { pick.value = ""; updateCodePrompt(); }   // nothing matches: don't keep a hidden choice
  });
  // Enter in the search box moves on to the code field instead of submitting the form.
  search.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); document.getElementById("code").focus(); } });
  featured.addEventListener("change", function () { pick.value = ""; updateCodePrompt(); });
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = document.getElementById("loginErr");
    err.textContent = "";
    GC.api("/api/login", { body: { user_id: selectedId(), access_code: document.getElementById("code").value }, noRedirect: true }).then(function (r) {
      window.location.href = r.level === "employee" ? "/employee" : "/dashboard";
    }).catch(function (ex) { err.textContent = ex.message; });
  });
})();
</script>
</body>
</html>
